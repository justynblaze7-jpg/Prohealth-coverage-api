# Render Blueprint: creates the API and its database in one step.
# In Render: New > Blueprint > pick this repository.
# Both start on the free plan. Upgrade the database before go-live:
# free Render Postgres databases expire 30 days after creation and have no backups.

services:
  - type: web
    name: prohealth-coverage-api
    runtime: node
    plan: free
    region: frankfurt          # closest Render region to Lagos
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: prohealth-coverage-db
          property: connectionString
      - key: STAFF_KEY
        generateValue: true    # Render creates a long random key; copy it from the Environment tab
      - key: ALLOWED_ORIGINS
        sync: false            # Render asks for this: the checker's web address, e.g. https://prohealth-coverage-checker.vercel.app
      - key: REPORT_TIMEZONE
        value: Africa/Lagos

databases:
  - name: prohealth-coverage-db
    databaseName: prohealth_coverage
    user: prohealth
    plan: free
    region: frankfurt
